name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        defaults: ["sdkconfig.defaults;sdkconfig.ci", "sdkconfig.defaults;sdkconfig.secure;sdkconfig.ci"]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32s3
          command: idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
